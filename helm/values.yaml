# Default values for the deployment
replicas: 1
image:
  repository: localhost:5000/jenkins-hello-world
  version: 1.0.5
  pullPolicy: IfNotPresent

podLabels:
  "nodeType": "SWIT"

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 9999
  runAsGroup: 9999

service:
  type: ClusterIP
  port: 8080

ingress:
  host: hello.local
  issuerName: hello-ingress
  tlsSecret: hello-tls-data

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 256m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

volumeMounts:
- name: tmp
  mountPath: /tmp

volumes:
- name: tmp
  emptyDir: {}
