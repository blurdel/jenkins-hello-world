apiVersion: v1
kind: Service
metadata:
  name: {{ include "jenkins-hello-world.fullname" . }}
  labels:
    {{- include "jenkins-hello-world.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
      
  selector:
    {{- include "jenkins-hello-world.selectorLabels" . | nindent 4 }}
