apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-{{ .Release.Name }}
  labels:
    app: {{ .Chart.Name }}-{{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      # nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
      
  selector:
    app: {{ .Chart.Name }}-{{ .Release.Name }}
